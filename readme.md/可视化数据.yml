        code: "import json\nimport re\n\ndef main(data: str) -> dict:\n    try:\n\
          \        text = data or \"\"\n        # 剥离 think/reasoning 标签内容\n      \
          \  text = re.sub(r\"<think>.*?</think>\", \"\", text, flags=re.S)\n    \
          \    # 只保留第一个 { 到最后一个 } 之间的 JSON\n        start = text.find(\"{\")\n   \
          \     end = text.rfind(\"}\")\n        if start == -1 or end == -1 or end\
          \ <= start:\n            return {\"echarts_option\": \"数据解析失败，请检查输入\"}\n\
          \        payload = json.loads(text[start:end + 1])\n\n        dates = payload.get(\"\
          dates\", [])\n        a = payload.get(\"A\", [])\n        b = payload.get(\"\
          B\", [])\n        c = payload.get(\"C\", [])\n        d = payload.get(\"\
          D\", [])\n\n        option = {\n            \"backgroundColor\": \"transparent\"\
          ,\n            \"title\": {\n                \"text\": \"乌龙奶茶色口红 7月每日销量（产品A/B/C/D）\"\
          ,\n                \"left\": \"center\",\n                \"textStyle\"\
          : {\"color\": \"#5C3A21\", \"fontSize\": 15, \"fontWeight\": 600}\n    \
          \        },\n            \"tooltip\": {\n                \"trigger\": \"\
          axis\",\n                \"triggerOn\": \"click\",\n                \"renderMode\"\
          : \"richText\",\n                \"confine\": True,\n                \"\
          textStyle\": {\"fontSize\": 10, \"lineHeight\": 14},\n                \"\
          padding\": [6, 8]\n            },\n            \"legend\": {\n         \
          \       \"top\": 36,\n                \"itemWidth\": 14,\n             \
          \   \"itemHeight\": 8,\n                \"textStyle\": {\"color\": \"#6B7280\"\
          , \"fontSize\": 11}\n            },\n            \"grid\": {\n         \
          \       \"left\": 44,\n                \"right\": 20,\n                \"\
          top\": 84,\n                \"bottom\": 48,\n                \"containLabel\"\
          : True\n            },\n            \"xAxis\": {\n                \"type\"\
          : \"category\",\n                \"name\": \"日期\",\n                \"data\"\
          : dates,\n                \"axisLabel\": {\"color\": \"#555\", \"fontSize\"\
          : 10, \"rotate\": 30, \"hideOverlap\": True}\n            },\n         \
          \   \"yAxis\": {\n                \"type\": \"value\",\n               \
          \ \"name\": \"销量（支）\",\n                \"axisLabel\": {\"color\": \"#555\"\
          , \"fontSize\": 11}\n            },\n            \"series\": [\n       \
          \         {\"name\": \"产品A\", \"type\": \"bar\", \"data\": a, \"itemStyle\"\
          : {\"color\": \"#A67B5B\"}, \"barMaxWidth\": 16},\n                {\"name\"\
          : \"产品B\", \"type\": \"bar\", \"data\": b, \"itemStyle\": {\"color\": \"\
          #C89B7B\"}, \"barMaxWidth\": 16},\n                {\"name\": \"产品C\", \"\
          type\": \"bar\", \"data\": c, \"itemStyle\": {\"color\": \"#E3C9B0\"}, \"\
          barMaxWidth\": 16},\n                {\"name\": \"产品D\", \"type\": \"bar\"\
          , \"data\": d, \"itemStyle\": {\"color\": \"#D9B999\"}, \"barMaxWidth\"\
          : 16}\n            ]\n        }\n\n        # 关键：echarts 代码块包裹，Dify 结果页才会渲染成柱状图\n\
          \        code_block = \"```echarts\\n\" + json.dumps(option, ensure_ascii=False)\
          \ + \"\\n```\"\n        return {\"echarts_option\": code_block}\n    except\
          \ Exception:\n        return {\"echarts_option\": \"数据解析失败，请检查输入\"}"
